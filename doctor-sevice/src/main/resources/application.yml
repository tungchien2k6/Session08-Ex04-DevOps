server:
    port: 8082

spring:
    application:
        name: doctor-service
    datasource:
        driver-class-name: org.postgresql.Driver
        password: S1mpL0rd
        url: jdbc:postgresql://localhost:5432/doctor_db
        username: postgres
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}

resilience4j:
    ratelimiter:
        instances:
            searchDoctorLimit:
                limit-for-period: 5
                limit-refresh-period: 10s
                timeout-duration: 0